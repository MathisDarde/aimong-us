name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-north-1
  SERVICE: aimong-us
  APP_URL: https://aimong-us.fwr8hz3a31smc.eu-north-1.cs.amazonlightsail.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build image
        run: docker build -t "$SERVICE" .

      - name: Push image
        run: |
          aws lightsail push-container-image --service-name "$SERVICE" --label app --image "$SERVICE" | tee push.log
          IMAGE=$(grep -o ":$SERVICE\.app\.[0-9]*" push.log | head -1)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Start deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        # TRUSTED_PROXIES is Lightsail's private network, where its load balancer runs
        run: |
          CONTAINERS=$(jq -n --arg image "$IMAGE" '{app: {image: $image, ports: {"3000": "HTTP"}, environment: {
            PORT: "3000",
            WEB_ORIGIN: env.APP_URL,
            BETTER_AUTH_URL: env.APP_URL,
            TRUSTED_PROXIES: "172.16.0.0/12",
            DATABASE_URL: env.DATABASE_URL,
            BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET,
            AI_API_KEY: env.AI_API_KEY,
            AI_BASE_URL: env.AI_BASE_URL
          }}} | .app.environment |= with_entries(select(.value != ""))')
          aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --containers "$CONTAINERS" \
            --public-endpoint '{"containerName": "app", "containerPort": 3000, "healthCheck": {"path": "/api/health"}}' \
            > /dev/null

      - name: Wait for the new version to go live
        timeout-minutes: 15
        run: |
          while true; do
            STATE=$(aws lightsail get-container-service-deployments --service-name "$SERVICE" --query 'deployments[0].state' --output text)
            echo "Deployment state: $STATE"
            if [ "$STATE" = ACTIVE ]; then break; fi
            if [ "$STATE" = FAILED ]; then echo "::error::Deployment failed, the previous version is still live. Check the container logs in Lightsail."; exit 1; fi
            sleep 15
          done
          echo "Live at $APP_URL"
